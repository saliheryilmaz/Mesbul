<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş — MesBul</title>
{% load static %}
<link rel="icon" type="image/png" href="{% static 'karsilastirma/favicon1.png' %}">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Tam ekran arka plan görseli */
  .bg {
    position: fixed;
    inset: 0;
    background: url("{% static 'karsilastirma/meslassanal.png' %}") center center / cover no-repeat;
    z-index: 0;
  }
  /* Hafif karartma katmanı — formu öne çıkarır */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(10, 15, 30, 0.45);
  }

  /* Kart */
  .card-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 1rem;
    background: rgba(255, 255, 255, 0.13);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 20px;
    padding: 2.5rem 2rem 2rem;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
  }

  /* Logo */
  .logo-area {
    text-align: center;
    margin-bottom: 1.75rem;
  }
  .logo-img {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    object-fit: cover;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
    margin-bottom: .75rem;
  }
  .logo-name {
    display: block;
    font-size: 1.375rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -.02em;
    line-height: 1.2;
  }
  .logo-sub {
    display: block;
    font-size: .75rem;
    font-weight: 500;
    color: rgba(255,255,255,.6);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .card-title {
    text-align: center;
    font-size: .9375rem;
    font-weight: 500;
    color: rgba(255,255,255,.85);
    margin-bottom: 1.75rem;
  }

  /* Hata */
  .error {
    display: flex;
    align-items: center;
    gap: .5rem;
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.4);
    border-radius: 8px;
    padding: .75rem 1rem;
    color: #FCA5A5;
    font-size: .875rem;
    font-weight: 500;
    margin-bottom: 1.25rem;
  }

  /* Form */
  .field { margin-bottom: 1.125rem; }

  .field-label {
    display: block;
    font-size: .6875rem;
    font-weight: 600;
    color: rgba(255,255,255,.65);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: .4rem;
  }

  .input-wrap { position: relative; }

  .input-icon {
    position: absolute;
    left: .875rem;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,.45);
    font-size: .875rem;
    pointer-events: none;
  }

  .field-input {
    width: 100%;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    padding: .75rem .875rem .75rem 2.5rem;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: .9375rem;
    font-weight: 500;
    outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .field-input::placeholder { color: rgba(255,255,255,.35); font-weight: 400; }
  .field-input:focus {
    border-color: rgba(232,93,38,.7);
    background: rgba(255,255,255,.17);
    box-shadow: 0 0 0 3px rgba(232,93,38,.2);
  }

  .toggle-password {
    position: absolute;
    right: .875rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,.4);
    font-size: .875rem;
    padding: 0;
    transition: color .2s;
  }
  .toggle-password:hover { color: rgba(255,255,255,.7); }

  /* Giriş butonu */
  .btn-primary {
    width: 100%;
    background: #E85D26;
    border: none;
    border-radius: 8px;
    padding: .9rem 1.5rem;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: .9375rem;
    font-weight: 700;
    letter-spacing: .03em;
    cursor: pointer;
    transition: background .2s, transform .1s, box-shadow .2s;
    margin-top: .75rem;
    box-shadow: 0 4px 16px rgba(232,93,38,.4);
  }
  .btn-primary:hover {
    background: #C94D1A;
    box-shadow: 0 6px 20px rgba(232,93,38,.5);
  }
  .btn-primary:active { transform: translateY(1px); }

  /* Footer */
  .footer-note {
    text-align: center;
    margin-top: 1.5rem;
    font-size: .8125rem;
    color: rgba(255,255,255,.5);
  }

  .security-note {
    text-align: center;
    margin-top: 1rem;
    font-size: .6875rem;
    color: rgba(255,255,255,.35);
    font-weight: 500;
  }

  /* Alt copyright */
  .page-footer {
    position: fixed;
    bottom: 1rem;
    left: 0; right: 0;
    text-align: center;
    font-size: .6875rem;
    color: rgba(255,255,255,.35);
    z-index: 1;
  }

  @media (max-width: 480px) {
    .card-wrap { padding: 2rem 1.25rem 1.5rem; }
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="card-wrap">

  <div class="logo-area">
    <img src="{% static 'karsilastirma/favicon1.png' %}" alt="MesBul" class="logo-img">
    <span class="logo-name">MesBul</span>
    <span class="logo-sub">Lastik Fiyat Karşılaştırma</span>
  </div>

  <p class="card-title">Hesabınıza giriş yapın</p>

  {% if hata %}
    <div class="error">
      <span>⚠️</span>
      <span>{{ hata }}</span>
    </div>
  {% endif %}

  <form method="POST" action="{% url 'giris' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
    {% csrf_token %}

    <div class="field">
      <label class="field-label">Kullanıcı Adı</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input
          type="text"
          name="kullanici_adi"
          class="field-input"
          placeholder="kullanici_adi"
          autocomplete="username"
          autofocus
          required
        >
      </div>
    </div>

    <div class="field">
      <label class="field-label">Şifre</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input
          type="password"
          name="sifre"
          id="sifre-input"
          class="field-input"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
        <button type="button" class="toggle-password" onclick="toggleSifre()" title="Şifreyi göster/gizle">
          <span id="goz-ikon">👁️</span>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary">Giriş Yap</button>
  </form>

  <div class="footer-note">
    Hesabınız yok mu? Yöneticinizle iletişime geçin.
  </div>

  <div class="security-note">
    🔐 Güvenli bağlantı · Yetkisiz erişim yasaktır
  </div>

</div>

<div class="page-footer">© 2026 MesBul. Tüm hakları saklıdır.</div>

<script>
function toggleSifre() {
  const input = document.getElementById('sifre-input');
  const ikon  = document.getElementById('goz-ikon');
  if (input.type === 'password') {
    input.type = 'text';
    ikon.textContent = '🙈';
  } else {
    input.type = 'password';
    ikon.textContent = '👁️';
  }
}
</script>

</body>
</html>
