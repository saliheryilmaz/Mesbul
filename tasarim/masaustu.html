<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MesBul · Masaüstü tasarımları</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink);--bg:#f4f5f7;--surface:white;--ink:#202630;--muted:#586476;--line:#dce1e7;--accent:#a73e0c;--tint:#fff0e5}body.gece{--bg:#141c22;--surface:#1c272e;--ink:#eff6f4;--muted:#b3c1c4;--line:#37454d;--accent:#98dfc8;--tint:#293e39}body.katalog{--bg:#f8f5ed;--surface:#fffdf7;--ink:#27352e;--muted:#5d685e;--line:#dcd6c6;--accent:#2c5946;--tint:#e5edde}nav{background:#27282a;color:white;display:flex;align-items:center;gap:8px;padding:9px 3vw;font-size:13px}nav span{margin-right:12px}nav a{color:#ccc;text-decoration:none;padding:6px 12px;border-radius:5px}nav a[aria-current]{background:white;color:#232323}header{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);padding:18px 3vw}header b{font-size:25px;letter-spacing:-1.7px}header b em{color:var(--accent);font-style:normal}header span,.caption{color:var(--muted);font-size:13px}main{max-width:1680px;margin:auto;padding:26px 3vw}.title{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}h1{font-size:36px;letter-spacing:-1.8px;margin:2px 0 0}h2{font-size:17px;margin:0 0 18px}.workspace{display:grid;grid-template-columns:208px minmax(0,1fr);gap:22px}aside,.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px}aside{align-self:start;padding:18px}fieldset{border:0;border-top:1px solid var(--line);padding:12px 0 0;margin:12px 0 0}legend{font-size:13px;font-weight:700}label{display:flex;align-items:center;gap:8px;color:var(--muted);padding:5px 0;font-size:14px}input{accent-color:var(--accent)}.sheet{overflow:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px;border-bottom:1px solid var(--line)}input[type=search],button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 12px}input[type=search]{width:min(390px,65%)}button{cursor:pointer;font-weight:650}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th,td{padding:11px 16px;border-bottom:1px solid var(--line)}th{background:var(--bg);color:var(--muted);font-size:12px}td:last-child,th:last-child{text-align:right;white-space:nowrap}tbody tr:last-child td{border:0}.model{display:block;font-size:13px;color:var(--muted);margin-top:2px}.price{font-weight:750;font-variant-numeric:tabular-nums}.stock{font-weight:650;white-space:nowrap}.low{background:var(--tint);color:var(--accent);padding:3px 7px;border-radius:5px}.gece .workspace{display:flex;flex-direction:column;gap:12px}.gece aside{display:flex;width:100%;align-items:center;gap:24px;padding:10px 16px}.gece aside h2{margin:0}.gece fieldset{display:flex;gap:10px;align-items:center;border:0;margin:0;padding:0}.gece legend{float:left;margin-right:8px}.gece .sheet,.gece aside{border-radius:5px}.gece th,.gece td{padding:7px 18px}.gece .model{display:inline;margin-left:12px}.gece .price,.gece h1{font-family:ui-monospace,monospace;color:var(--accent)}.katalog .workspace{grid-template-columns:minmax(0,1fr) 205px}.katalog aside{grid-column:2;grid-row:1}.katalog .sheet{grid-column:1;grid-row:1;background:transparent;border:0;border-top:3px solid var(--accent);border-radius:0}.katalog h1,.katalog header b,.katalog td b{font-family:Georgia,serif}.katalog .bar{padding-left:0;padding-right:0}.katalog td{padding-block:13px}.katalog aside{background:transparent;border-radius:0;border-width:0 0 0 1px}.katalog .price{font-size:17px}.empty{padding:22px}.empty[hidden]{display:none}@media(max-width:1000px){.gece aside{flex-wrap:wrap}.workspace,.katalog .workspace{display:flex;flex-direction:column}aside{width:100%}.sheet{width:100%}nav{flex-wrap:wrap}table{min-width:700px}}
</style><nav aria-label="Tasarım seçimi"><span>Masaüstü önizleme</span><a href="#sade">Sade Turuncu</a><a href="#gece">Gece Paneli</a><a href="#katalog">Katalog</a></nav>
<header><b>Mes<em>Bul</em></b><span>Lastik fiyat karşılaştırma</span></header><main><div class="title"><div><span class="caption">Lastik teklifleri</span><h1>205/55 R16</h1></div><span id="count" class="caption" aria-live="polite"></span></div><div class="workspace"><aside><h2>Filtreler</h2><fieldset id="seller"><legend>Toptancı</legend></fieldset><fieldset id="season"><legend>Mevsim</legend></fieldset></aside><section class="sheet"><div class="bar"><input type="search" aria-label="Marka veya model ara" placeholder="Marka veya model ara…"><button id="sort">Fiyat ↑</button></div><table><thead><tr><th>Marka ve model</th><th>Toptancı</th><th>Stok</th><th>Mevsim</th><th>DOT</th><th>Fiyat</th></tr></thead><tbody></tbody></table><div class="empty" hidden>Bu filtrelere uygun teklif bulunamadı.</div></section></div></main>
<script>
const offers=[
['Starmaxx','Naturen ST562 · 91H','Art4',2,'Yaz',2026,2418],['Citystar','CS-911 · 91V','Dinçbay',20,'Yaz',2025,2425],['Dayton','Touring 2 · 91V','Ayko',64,'Yaz',2026,2650],['Taurus','Winter · 91H','Art4',4,'Kış',2025,2778],['Landsail','4-Seasons · 94V XL','Ayko',8,'4 Mevsim',2025,2854.44],['Starmaxx','Icegripper W850 · 91H','Dinçbay',3,'Kış',2026,2975],['Laufenn','G Fit EQ+ · 91V','Ayko',16,'Yaz',2026,3015],['Sava','Intensa HP 2 · 91V','Art4',12,'Yaz',2025,3098],['Barum','Quartaris 5 · 94V XL','Dinçbay',6,'4 Mevsim',2026,3240],['Kumho','WinterCraft WP52 · 91H','Ayko',9,'Kış',2026,3460]];
const q=s=>document.querySelector(s),search=q('[type=search]'),sort=q('#sort');let dir=1;
function theme(){const name=['sade','gece','katalog'].includes(location.hash.slice(1))?location.hash.slice(1):'sade';document.body.className=name;document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.hash==='#'+name))}
function selected(id){return Array.from(document.querySelectorAll('#'+id+' input:checked'),x=>x.value)}
function draw(){const sellers=selected('seller'),seasons=selected('season'),term=search.value.trim().toLocaleLowerCase('tr');const rows=offers.filter(([b,m,s,n,t])=>(!sellers.length||sellers.includes(s))&&(!seasons.length||seasons.includes(t))&&(b+' '+m).toLocaleLowerCase('tr').includes(term)).sort((a,b)=>dir*(a[6]-b[6]));q('tbody').innerHTML=rows.map(([b,m,s,n,t,y,p])=>'<tr><td><b>'+b+'</b><span class="model">'+m+'</span></td><td>'+s+'</td><td><span class="stock '+(n<=4?'low':'')+'">'+(n<=4?'Son ':'')+n+' adet</span></td><td>'+t+'</td><td>'+y+'</td><td class="price">'+p.toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺</td></tr>').join('');q('.empty').hidden=!!rows.length;q('#count').textContent=rows.length+' teklif'}
for(const [id,index] of [['seller',2],['season',4]])for(const value of new Set(offers.map(x=>x[index]))){const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.value=value;box.onchange=draw;label.append(box,value);q('#'+id).append(label)}
search.oninput=draw;sort.onclick=()=>{dir*=-1;sort.textContent=dir===1?'Fiyat ↑':'Fiyat ↓';draw()};onhashchange=theme;theme();draw();
</script></html>
