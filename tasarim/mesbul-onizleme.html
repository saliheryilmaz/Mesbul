<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MesBul · Tasarım seçenekleri</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1ec;color:#232421;font:15px system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:40px 3vw}h1{font:500 clamp(30px,4vw,52px) Georgia,serif;letter-spacing:-.04em;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}h2{font-size:18px;letter-spacing:-.03em;margin:0 0 10px}.app{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 12px 28px #2524190e}.light{--bg:#f9fafb;--fg:#202936;--muted:#566171;--line:#dfe3ea;--surface:#fff;--accent:#b84215;--chip:#fff0e8}.dark{--bg:#151c23;--fg:#f0f5f2;--muted:#adbab9;--line:#36424a;--surface:#202a32;--accent:#96e6b9;--chip:#2c423c}.paper{--bg:#f9f5eb;--fg:#292f2a;--muted:#596457;--line:#d7cfbd;--surface:#fffdf6;--accent:#255746;--chip:#e8eee3}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}header strong{font-size:22px;letter-spacing:-.07em}header i{color:var(--accent);font-style:normal}header small{font-size:12px;color:var(--muted)}.content{padding:20px}.head{color:var(--muted);font-size:13px;margin-bottom:5px}.size{font-weight:750;font-size:clamp(25px,3vw,40px);letter-spacing:-.05em;margin:0 0 18px}.bar{display:flex;gap:8px;margin-bottom:14px}.bar input,.bar button{min-width:0;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:10px}.bar input{width:100%}.bar button{flex:none;cursor:pointer}.offers{display:grid;gap:9px}article{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}.row,.details{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:17px}.price{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}.model{font-size:13px;color:var(--muted);margin:6px 0 13px}.details{justify-content:flex-start;flex-wrap:wrap}.seller,.stock{font-size:13px;font-weight:650}.seller{color:var(--accent);background:var(--chip);padding:4px 8px;border-radius:5px}.dot{font-size:11px;color:var(--muted);margin-left:auto}.dark .size,.dark .price{font-family:ui-monospace,monospace}.dark .price{color:var(--accent)}.dark article{border-radius:4px;border-left:3px solid var(--accent)}.paper .size,.paper .brand,.paper header strong{font-family:Georgia,serif}.paper .offers{gap:0;border-top:2px solid var(--accent)}.paper article{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:16px 0}.empty{color:var(--muted)}@media(max-width:950px){.grid{grid-template-columns:1fr}main{max-width:580px;padding:24px 14px}.grid{gap:28px}}
</style><main><h1>MesBul için üç görünüm</h1><div class="grid"></div></main>
<script>
const models=[['Starmaxx','Naturen ST562 · 91H','Art4','Son 2 adet','2026',2418],['Citystar','CS-911 · 91V','Dinçbay','20 adet','2025',2425],['Dayton','Touring 2 · 91V','Ayko','64 adet','2026',2650]];
for(const [theme,title] of [['light','01 · Sade Turuncu'],['dark','02 · Gece Paneli'],['paper','03 · Katalog']]){
 const section=document.createElement('section');
 section.innerHTML='<h2>'+title+'</h2><div class="app '+theme+'"><header><strong>Mes<i>Bul</i></strong><small>Fiyat karşılaştırma</small></header><div class="content"><div class="head">Lastik teklifleri</div><div class="size">205/55 R16</div><div class="bar"><input aria-label="Model ara" placeholder="Model ara…"><button>Fiyat ↑</button></div><div class="offers"></div></div></div>';
 document.querySelector('.grid').append(section);
 const input=section.querySelector('input'),button=section.querySelector('button');let ascending=true;
 function draw(){const items=models.filter(x=>(x[0]+' '+x[1]).toLocaleLowerCase('tr').includes(input.value.toLocaleLowerCase('tr'))).sort((a,b)=>(a[5]-b[5])*(ascending?1:-1));section.querySelector('.offers').innerHTML=items.map(([brand,model,seller,stock,dot,price])=>'<article><div class="row"><b class="brand">'+brand+'</b><span class="price">'+price.toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺</span></div><div class="model">'+model+'</div><div class="details"><span class="seller">'+seller+'</span><span class="stock">'+stock+'</span><span class="dot">DOT '+dot+'</span></div></article>').join('')||'<p class="empty">Ürün bulunamadı.</p>'}
 button.onclick=()=>{ascending=!ascending;button.textContent=ascending?'Fiyat ↑':'Fiyat ↓';draw()};input.oninput=draw;draw();
}
</script></html>
